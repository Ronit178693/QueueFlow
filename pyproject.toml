[project]
name = "queueflow"
version = "0.1.0"
description = "Reliable asynchronous job processing with Python and Amazon SQS"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "boto3",
    "sqlalchemy",
    "psycopg[binary]",
    "pydantic-settings",
    "alembic",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
