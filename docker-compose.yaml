services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: queueflow
      POSTGRES_USER: queueflow
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queueflow -d queueflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  localstack:
    image: localstack/localstack
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: ap-south-1
    ports:
      - "4566:4566"

volumes:
  postgres_data:
